name: Trace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Scan published files
        run: >-
          docker run --rm --network none --read-only
          -v "$PWD/dist:/scan:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /scan --redact=100 --no-banner
